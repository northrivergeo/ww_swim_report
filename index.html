<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterWays</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map {
            height: 900px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        $(document).ready(function() {
            // Initialize the Map
            var map = L.map('map').setView([35.16392,-85.27877], 11); // Center the map  35.04756,-85.30398

            // Add a Tile Layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 24,
                attribution: '© OpenStreetMap'
            }).addTo(map);
            
	    ///////////////////////////Define a Style Function for GeoJSON
            function brstyle(feature) {
                return {
                    fillColor: "blue",
		    radius: 10, 	
                    weight: 1,
                    opacity: 1,
                    color: 'black',
                    fillOpacity: 0.7
                };
	    }
	    

            //////////////////////////// Create a BR GeoJSON layer
             var br_geojsonLayer = L.geoJson(null, {
                 style: brstyle,
                 onEachFeature: function(feature, layer) {
                     layer.bindPopup(feature.properties.name); 
               },
		pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
	         }); 
                } 
             }).addTo(map);
             $.getJSON('https://northrivergeo.github.io/ww_swim_report/data/testing_locations.geojson', function(data) {
                  br_geojsonLayer.addData(data);
             });


            ////////////////////////////// Layer control
            var baseMaps = {
                  "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                  maxZoom: 24,
                  attribution: '© OpenStreetMap'
                 })
            };

        });
    </script>
</body>
</html>
