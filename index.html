<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterWays</title>
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
       body { margin:0; padding:0; }
       #map { position: absolute; top:0; bottom:0; right:0; left:0; }
       #map-title { position: relative; margin-top: 10px; margin-left: 50px; float: left; background: white; border: 2px solid rgba(0,0,0,0.2); padding: 6px 8px; font-family: Helvetica; font-weight: bold; font-size: 24px; z-index: 800; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
	    $(document).ready(function() {
            // Initialize the Map
            //var map = L.map('map').setView([35.16392,-85.27877], 11); // Center the map 
            var map = L.map('map', {
            center: [35.16392,-85.27877],
            zoom: 11
            });

            // Add a Tile Layer
             L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 24,
                attribution: '© OpenStreetMap'
            }).addTo(map);

           
	    ///////////////////////////Define a Style Function for GeoJSON Water Sampling Sites
            function wwstyle(feature) {
                return {
                    fillColor: "blue",
		    radius: 20, 	
                    weight: 1,
                    opacity: 1,
                    color: 'black',
                    fillOpacity: 0.7
                };
	    }
	    
	    ///////////////////////////Define a Style Function for GeoJSON Watershed polygons
            function wsstyle(feature) {
                return {
                    weight: 4,
                    opacity: 1,
                    color: 'orange',
                    fillOpacity: 0
                };
            }


	    //////////////////////////// Create a Watershed GeoJSON layer
             var ws_geojsonLayer = L.geoJson(null, {
                 style: wsstyle,
                 onEachFeature: function(feature, layer) {
                     layer.bindPopup(feature.properties.name); 
               },
		pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
	         }); 
                } 
             //}).addTo(map);
             });
             $.getJSON('https://northrivergeo.github.io/ww_swim_report/data/huc12.geojson', function(data) {
                  ws_geojsonLayer.addData(data);
             });
            
	    //////////////////////////// Create a Water Sampling GeoJSON layer
             var ww_geojsonLayer = L.geoJson(null, {
                 style: wwstyle,
                 onEachFeature: function(feature, layer) {
                     layer.bindPopup(feature.properties.name); 
               },
		pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
	         }); 
                } 
             }).addTo(map);
             $.getJSON('https://northrivergeo.github.io/ww_swim_report/data/testing_locations.geojson', function(data) {
                  ww_geojsonLayer.addData(data);
             });



            //////////////////////////// Layer control
	    var osmhot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
                 maxZoom: 19,
                 attribution: '© OpenStreetMap contributors, Tiles style by Humanitarian OpenStreetMap Team hosted by OpenStreetMap France'});
            
	    var osm = 
		  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                  maxZoom: 24,
                 attribution: '© OpenStreetMap'
                });
             

	    ////////////////////////////// Layer control
            //var tnimagemap = {
	    //     "NAIP Imagery": L.tileLayer.wms('https://imagery.nationalmap.gov/arcgis/services/USGSNAIPImagery/ImageServer/WMSServer?',  {
	    //      layers: 'USGSNAIPImagery:NaturalColor',
	    //         format: "image/png",
	    //         transparent: true
            //       })
            //    };
              
            var baseMaps = {
		"OpenStreetMap": osm,
		"Humanitarian OpenStreetMap": osmhot
	        };

            var overlayMaps = {
                "Water Sampling": ww_geojsonLayer,
                "12 Digit Hucs": ws_geojsonLayer
               };

	    L.control.layers(baseMaps, overlayMaps, {collapsed: false}).addTo(map); 

	  });

    </script>
</body>
</html>
